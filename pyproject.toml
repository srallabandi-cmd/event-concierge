[project]
name = "event-concierge"
version = "0.1.0"
description = "AI secretary agent that triages LinkedIn event invites and manages your SF AI networking calendar"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cursor-sdk>=0.1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "playwright>=1.40",
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
    "httpx>=0.27",
    "rich>=13.0",
    "typer>=0.12",
    "pyyaml>=6.0",
    "python-dateutil>=2.9",
    "icalendar>=6.0",
    "openai>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
event-concierge = "event_concierge.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/event_concierge"]

[tool.ruff]
line-length = 100
target-version = "py311"
